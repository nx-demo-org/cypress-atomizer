
name: Execute Conformance Rules

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: main branch
    environment: prod
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Fetch base branch so Nx affected can diff against it (main may not exist in shallow/fork clones)
      - run: git fetch origin ${{ github.base_ref }}


      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - run: npm install @nx/conformance
      - run: npx nx-cloud conformance:check
